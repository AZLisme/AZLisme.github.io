<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>制作有声绘本 · 寻宝绘本馆</title><link rel="stylesheet" href="studio.css?v=1"></head><body>
<header class="top"><a href="../">‹ 返回书架</a><strong>📷 我的绘本工坊</strong><span id="saved">照片留在当前设备</span></header>
<main><section class="intro"><span class="badge">让纸上的故事，开口说话</span><h1>一起做一本有声绘本</h1><p>拍下完整书页，按顺序放好。生成后听一听、看一看，再加入你的书架。</p><ol class="steps"><li>① 拍照或上传</li><li>② 整理页序</li><li>③ 生成并校对</li></ol></section>
<section class="paper"><label class="titleLabel" for="title">绘本叫什么名字？</label><input id="title" maxlength="100" placeholder="例如：我的海洋冒险" autocomplete="off"><div class="captureActions"><button id="camera">📷 连续拍照</button><button id="choose">🖼 从相册选择</button><button id="nativeCamera">📸 使用系统相机</button></div><input id="files" type="file" accept="image/*" multiple hidden><input id="capture" type="file" accept="image/*" capture="environment" hidden><p class="hint">第一张作为封面。跨页插画请整幅拍下，尽量拍正、避开反光和手指。最多 40 页。</p><div id="photos" class="photos" aria-label="绘本照片"></div><p id="empty">还没有照片，先拍下绘本封面吧。</p></section>
<section class="paper generation"><div><h2>准备好，让故事发声</h2><p id="service">正在检查生成服务…</p><label id="codeLabel" hidden>制作邀请码 <input id="code" type="password" autocomplete="off"></label></div><button id="generate" class="primary" disabled>✨ 一键生成有声绘本</button><p id="status" role="status" aria-live="polite"></p><progress id="progress" hidden max="100"></progress><button id="review" hidden>📖 校对生成的绘本</button></section>
<p class="footnote">草稿保存在当前浏览器。清除浏览器数据会删除本机草稿和个人书架入口，请保留原始照片。生成的声音为 AI 配音。</p></main>
<dialog id="cameraDialog"><header><h2>拍下完整书页</h2><button id="closeCamera" aria-label="关闭相机">×</button></header><video id="video" autoplay playsinline muted></video><p id="cameraCount"></p><div class="dialogActions"><button id="snap" class="primary">📷 拍一张</button><button id="finishCamera">拍好了</button></div></dialog>
<dialog id="reviewDialog"><header><h2>最后检查一下</h2><button id="closeReview" aria-label="关闭校对">×</button></header><p id="warnings"></p><canvas id="previewCanvas" aria-label="生成的绘本页面"></canvas><div class="dialogActions"><button id="reviewPrev">‹</button><span id="reviewCount"></span><button id="reviewNext">›</button><button id="listen">▶ 听这一页</button></div><div id="reviewText"></div><div class="publishBar"><p>确认书页、文字和声音没有明显错误后，加入书架。</p><button id="publish" class="primary">⭐ 加入我的书架</button></div><audio id="previewAudio"></audio></dialog>
<script src="../artwork.js?v=2"></script><script src="studio.js?v=1"></script></body></html>
