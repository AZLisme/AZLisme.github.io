<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eaf7ff"><title>小小绘本馆 · 一起读一本书</title><link rel="stylesheet" href="style.css?v=10"></head><body>
<div id="shelf"><header class="mast"><a class="brand" href="#"><span class="brandMark" aria-hidden="true">📖</span><span class="brandName">小小绘本馆<small>OUR LITTLE LIBRARY</small></span></a><span class="family">一起读，一起长大</span></header><main><section class="intro"><div class="introCopy"><p class="eyebrow">HELLO, LITTLE EXPLORER!</p><h1>今天，去<span>故事里</span><br>冒险吧！</h1><p>小小的一本书，装着大大的世界。</p></div><div class="heroArt" aria-hidden="true"><div class="cloud cloudOne"></div><div class="cloud cloudTwo"></div><div class="sun">⌣</div><div class="rabbit"><div class="ear"></div><div class="ear earRight"></div><div class="rabbitFace"><div class="rabbitEyes"></div><div class="rabbitCheeks"></div><div class="rabbitMouth"></div></div><div class="rabbitBook">✦</div></div></div></section><section class="playlistCard"><div><h2>我的故事播放列表</h2><p id="queueSummary">选几本故事，接着听</p></div><button id="editQueue">选书与播放模式</button><button id="startQueue" class="primary">▶ 播放列表</button></section><section id="continueSection" hidden><div class="sectionTitle"><h2>故事还没讲完呢</h2><span>继续阅读</span></div><div id="continueCard"></div></section><section><div class="sectionTitle"><h2>今天一起读这本</h2><span>家长推荐</span></div><div id="recommendations" class="books"></div></section><section><div class="sectionTitle"><h2>我的绘本小书架</h2><span id="count"></span></div><div id="allBooks" class="books compact"></div></section><p class="footnote">每一个“为什么”，都值得一起寻找答案。</p></main><footer>一起发现，一起长大。<span>小小绘本馆</span></footer></div>
<div id="reader" hidden><header class="readerHeader"><button id="back" class="quiet">‹ 书架</button><div><strong id="bookTitle"></strong><span id="pageTitle"></span></div><div class="readerTools"><button id="pointRead" class="quiet" aria-pressed="false">点读：关</button><button id="contentsBtn" class="quiet">目录</button></div></header><div class="readingStage"><button id="sidePrev" class="pageTurn pageTurnPrev" aria-label="上一页"><span aria-hidden="true">‹</span><small>上一页</small></button><div id="viewport"><div id="pageCanvas"><img id="pageImage" alt="" draggable="false"><div id="hotspots" hidden></div></div><div id="loading">正在翻开故事…</div><button id="resetZoom" hidden>恢复画面</button></div><button id="sideNext" class="pageTurn pageTurnNext" aria-label="下一页"><span aria-hidden="true">›</span><small>下一页</small></button></div><nav class="controls" aria-label="阅读控制"><button id="prev" aria-label="上一页">‹</button><div class="progress"><span id="pageCount"></span><div><i id="progressBar"></i></div></div><button id="play" class="primary">▶ 听故事</button><button id="autoPlay" aria-pressed="false">▶ 自动读</button><label class="speedControl">语速 <select id="playbackSpeed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="queueBtn">播放列表</button><button id="sentencesBtn">逐句听</button><button id="repeat">↻ 再听一次</button><button id="translation">中 看中文</button><button id="next" aria-label="下一页">›</button></nav><div id="notice" role="status"></div><div id="translationPanel" class="panel" hidden><header><div><span class="eyebrow">一起理解这个故事</span><h2 id="translationTitle"></h2></div><button id="closeTranslation" aria-label="关闭中文">✕</button></header><p id="translationText"></p></div><div id="sentencesPanel" class="panel" hidden><header><div><span class="eyebrow">点一句，单独重听</span><h2 id="sentencesTitle"></h2></div><button id="closeSentences" aria-label="关闭逐句朗读">✕</button></header><div id="sentencesList"></div></div><div id="contentsPanel" class="panel" hidden><header><h2>故事目录</h2><button id="closeContents" aria-label="关闭目录">✕</button></header><div id="contentsList"></div></div></div>
<div id="queuePanel" class="panel queuePanel" hidden><header><h2>故事播放列表</h2><button id="closeQueue" aria-label="关闭播放列表">✕</button></header><label class="queueMode">播放方式 <select id="queueMode"><option value="order">按顺序播放</option><option value="repeat">单本循环</option><option value="shuffle">随机播放</option></select></label><p class="queueHint">勾选想听的书，用箭头调整顺序。顺序播放结束后停止；循环和随机会持续播放。</p><div id="queueChoices"></div><h3>播放顺序</h3><div id="queueOrder"></div><div class="queueActions"><button id="queueStart">▶ 从头播放列表</button><button id="queueStop">■ 停止播放列表</button></div><p id="queueStatus" role="status"></p></div><audio id="audio" preload="none"></audio><script src="playback.js?v=5"></script><script src="playlist.js?v=1"></script><script src="listening.js?v=1"></script><script src="app.js?v=10"></script></body></html>
