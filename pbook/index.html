<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eaf3ee"><title>小小绘本馆 · 一起读一本书</title><link rel="stylesheet" href="style.css?v=3"></head><body>
<div id="shelf"><header class="mast"><a class="brand" href="#">小小绘本馆<span>OUR LITTLE LIBRARY</span></a><span class="family">和你一起，读懂世界</span></header><main><section class="intro"><p class="eyebrow">今天，也有一个新发现</p><h1>一起读一本书。</h1><p>看看画，听听故事，让好奇心慢慢长大。</p></section><section id="continueSection" hidden><div class="sectionTitle"><h2>接着上次的故事</h2><span>继续阅读</span></div><div id="continueCard"></div></section><section><div class="sectionTitle"><h2>今天想一起读</h2><span>家长推荐</span></div><div id="recommendations" class="books"></div></section><section><div class="sectionTitle"><h2>我们的全部绘本</h2><span id="count"></span></div><div id="allBooks" class="books compact"></div></section><p class="footnote">阅读进度保存在这台设备上。换个地方，故事还可以重新开始。</p></main><footer>一点陪伴，一点好奇。<span>小小绘本馆</span></footer></div>
